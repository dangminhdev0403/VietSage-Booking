<script>
  (function() {
    const chips = document.querySelectorAll('.pref-chip');
    
    function updateChipState(chip, isSelected) {
      if (isSelected) {
        chip.classList.remove('bg-surface-container-lowest', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary');
        const icon = chip.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.remove('text-primary');
          icon.classList.add('text-on-primary');
        }
      } else {
        chip.classList.remove('bg-primary', 'text-on-primary');
        chip.classList.add('bg-surface-container-lowest', 'text-on-surface');
        const icon = chip.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.remove('text-on-primary');
          icon.classList.add('text-primary');
        }
      }
    }

    chips.forEach(chip => {
      // initialize
      const selected = chip.getAttribute('data-selected') === 'true';
      updateChipState(chip, selected);

      chip.addEventListener('click', () => {
        const currentlySelected = chip.getAttribute('data-selected') === 'true';
        chip.setAttribute('data-selected', String(!currentlySelected));
        updateChipState(chip, !currentlySelected);
      });
    });

    const submitBtn = document.getElementById('submit-btn');
    if (submitBtn) {
      submitBtn.addEventListener('click', () => {
        submitBtn.classList.add('opacity-80');
        setTimeout(() => {
          submitBtn.classList.remove('opacity-80');
        }, 300);
      });
    }
  })();
