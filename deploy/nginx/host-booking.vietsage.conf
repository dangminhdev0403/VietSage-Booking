# Cấu hình Host Nginx trên VPS (72.62.69.172)
# File đích trên VPS: /etc/nginx/sites-available/booking.vietsage.com
# Kích hoạt: ln -s /etc/nginx/sites-available/booking.vietsage.com /etc/nginx/sites-enabled/
#
# Topology:
# Cloudflare (SSL) -> VPS Host Nginx (:80/:443) -> 127.0.0.1:28080 (Docker booking-nginx)

# --- 1. Cấu hình HTTP (Dùng ngay với Cloudflare SSL Flexible hoặc trước khi chạy Certbot) ---
server {
    listen 80;
    listen [::]:80;
    server_name booking.vietsage.com;

    client_max_body_size 20M;

    # Cloudflare Real IP passthrough
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
