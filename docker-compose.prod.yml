services:
  migrate:
    image: "${MIGRATE_IMAGE:-booking-backend-migrate:prod}"
    build:
      context: ./backend-booking
      dockerfile: Dockerfile
      target: migration
    container_name: booking-migrate
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    env_file:
      - path: ./secrets/production/backend.env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - vietsage-db

  backend:
    image: "${BACKEND_IMAGE:-booking-backend:prod}"
    build:
      context: ./backend-booking
      dockerfile: Dockerfile
      target: runtime
    container_name: booking-backend
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging: *logging
    env_file:
      - path: ./secrets/production/backend.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8081"
      DATABASE_POOL_MAX: "10"
      DATABASE_CONNECTION_TIMEOUT_MS: "2000"
      DATABASE_IDLE_TIMEOUT_MS: "10000"
      DATABASE_LOCK_TIMEOUT_MS: "3000"
      DATABASE_STATEMENT_TIMEOUT_MS: "8000"
      DATABASE_QUERY_TIMEOUT_MS: "9000"
      DATABASE_TRANSACTION_TIMEOUT_MS: "10000"
      HTTP_REQUEST_TIMEOUT_MS: "12000"
      HTTP_KEEP_ALIVE_TIMEOUT_MS: "5000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8081/health/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - edge
      - vietsage-db
      - egress

  frontend:
    image: "${FRONTEND_IMAGE:-booking-frontend:prod}"
    build:
      context: ./frontend-booking
      dockerfile: Dockerfile
    container_name: booking-frontend
    restart: unless-stopped
    mem_limit: 384m
    cpus: "0.75"
    pids_limit: 128
    logging: *logging
    env_file:
      - path: ./secrets/production/frontend.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      INTERNAL_BACKEND_URL: http://backend:8081
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - edge
      - egress

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: booking-nginx
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    logging: *logging
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${BOOKING_NGINX_HTTP_PORT:-28080}:8080"
    volumes:
      - ./deploy/nginx/docker-booking.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - edge

networks:
  edge:
  egress:
  vietsage-db:
    external: true
    name: "${VIETSAGE_BACKEND_NETWORK:-fullstack-vietsage_backend}"
